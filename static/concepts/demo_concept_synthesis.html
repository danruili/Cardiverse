<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Concept Synthesis — Cardiverse</title>
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f1f5f9; color: #1e293b; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .main { display: flex; flex: 1; overflow: hidden; min-height: 0; }

    .left-panel { flex: 1 1 56%; min-width: 0; min-height: 0; display: flex; flex-direction: column; border-right: 1px solid #e2e8f0; overflow: hidden; }
    .panel-header { background: #f8fafc; padding: 10px 18px; font-size: 11px; font-weight: 700; color: #94a3b8; letter-spacing: 0.8px; text-transform: uppercase; border-bottom: 1px solid #e2e8f0; flex-shrink: 0; }
    #graph-container { flex: 1; min-height: 0; background: #f8fafc; position: relative; overflow: hidden; }
    #graph-container canvas { display: block; }

    .right-panel { flex: 0 0 44%; display: flex; flex-direction: column; overflow: hidden; background: #fff; }
    .prompt-scroll { flex: 1; overflow-y: auto; padding: 14px; background: #f8fafc; }
    .prompt-scroll::-webkit-scrollbar { width: 5px; }
    .prompt-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

    .step-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 9px; margin-bottom: 10px; overflow: hidden; transition: border-color 0.3s, box-shadow 0.3s; }
    .step-card.active { border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99,102,241,0.1), 0 4px 16px rgba(99,102,241,0.1); }
    .step-card.done { opacity: 0.5; }
    .step-card-header { display: flex; align-items: center; gap: 9px; padding: 9px 13px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; cursor: pointer; user-select: none; transition: background 0.15s; }
    .step-card-header:hover { background: #f1f5f9; }
    .step-num { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
    .step-card.active  .step-num { background: #6366f1; color: #fff; }
    .step-card.done    .step-num { background: #dcfce7; color: #16a34a; border: 1px solid #86efac; }
    .step-card.pending .step-num { background: #f1f5f9; color: #94a3b8; border: 1px solid #e2e8f0; }
    .step-title { font-size: 12px; font-weight: 600; color: #1e293b; flex: 1; }
    .step-card.done    .step-title { color: #94a3b8; }
    .step-card.pending .step-title { color: #94a3b8; }
    .step-body { padding: 11px 13px; display: none; }
    .step-card.active .step-body, .step-card.expanded .step-body { display: block; }

    .ctx-row { display: flex; align-items: center; gap: 7px; margin-bottom: 9px; font-size: 11px; }
    .ctx-tag { background: #eff6ff; border: 1px solid #bfdbfe; color: #2563eb; border-radius: 4px; padding: 2px 7px; font-size: 10px; font-weight: 700; }

    .prompt-block { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; overflow: hidden; margin-bottom: 9px; }
    .prompt-label { padding: 4px 9px; font-size: 9px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; border-bottom: 1px solid #e2e8f0; }
    .label-user { color: #2563eb; background: #eff6ff; }
    .label-llm  { color: #059669; background: #f0fdf4; }
    .prompt-text { padding: 9px; font-size: 11px; line-height: 1.6; color: #475569; white-space: pre-wrap; font-family: 'Consolas', 'Fira Code', monospace; }
    .prompt-text .hl-header { color: #0f172a; font-weight: 700; }
    .prompt-text .hl-key    { color: #4f46e5; }
    .prompt-text .hl-var    { color: #d97706; font-weight: 600; }
    .prompt-text .hl-json   { color: #059669; }
    .prompt-text .hl-node   { color: #dc2626; font-weight: 600; }
    .response-block { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 6px; padding: 9px; font-size: 11px; line-height: 1.6; color: #065f46; font-family: 'Consolas', 'Fira Code', monospace; white-space: pre-wrap; margin-bottom: 9px; }

    .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .chip { padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; border: 1px solid; }

    .controls { background: #fff; border-top: 1px solid #e2e8f0; padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .btn { padding: 6px 15px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; transition: background 0.15s, transform 0.1s; }
    .btn:active { transform: scale(0.97); }
    .btn-primary  { background: #6366f1; color: #fff; }
    .btn-primary:hover { background: #4f46e5; }
    .btn-primary:disabled { background: #e2e8f0; color: #94a3b8; cursor: not-allowed; }
    .btn-secondary { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-secondary:disabled { color: #cbd5e1; cursor: not-allowed; }
    .progress-bar { flex: 1; height: 4px; background: #e2e8f0; border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #6366f1, #8b5cf6); border-radius: 2px; transition: width 0.4s ease; }
    .step-counter { font-size: 11px; color: #94a3b8; white-space: nowrap; }

    /* Legend */
    .legend { position: absolute; bottom: 12px; left: 12px; background: rgba(255,255,255,0.92); border: 1px solid #e2e8f0; border-radius: 8px; padding: 9px 12px; font-size: 10px; display: flex; flex-direction: column; gap: 5px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); backdrop-filter: blur(4px); }
    .legend-title { font-weight: 700; color: #94a3b8; letter-spacing: 0.5px; text-transform: uppercase; font-size: 9px; margin-bottom: 1px; }
    .legend-row { display: flex; align-items: center; gap: 7px; color: #475569; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; border: 2px solid; }
    .legend-swatch { width: 14px; height: 8px; border-radius: 2px; flex-shrink: 0; border: 1px solid; }
    @media (max-width: 768px) {
      .main { flex-direction: column; }
      .left-panel { flex: 0 0 42%; border-right: none; border-bottom: 1px solid #e2e8f0; }
      .right-panel { flex: 1; width: 100%; min-height: 0; }
      .legend { font-size: 9px; padding: 7px 10px; gap: 4px; }
    }
  </style>
</head>
<body>
<div class="main">
  <div class="left-panel">
    <div class="panel-header">Mechanic Concept Space</div>
    <div id="graph-container">
      <div class="legend" id="legend">
        <div class="legend-title" id="legend-title">Games</div>
        <div id="legend-body"></div>
      </div>
    </div>
  </div>
  <div class="right-panel">
    <div class="panel-header">LLM Prompts &amp; Responses</div>
    <div class="prompt-scroll" id="prompt-scroll"></div>
    <div class="controls">
      <button class="btn btn-secondary" id="btn-reset">Reset</button>
      <button class="btn btn-secondary" id="btn-prev" disabled>← Prev</button>
      <button class="btn btn-primary"   id="btn-next">Next Step →</button>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <span class="step-counter" id="step-counter">0 / 7</span>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// STYLE HELPERS
// ═══════════════════════════════════════════════════════

const GAME_S = {
  'Void Rush':     { bg: '#ede9fe', bd: '#7c3aed', ft: '#4c1d95' },
  'Battle Deck':   { bg: '#fff7ed', bd: '#ea580c', ft: '#9a3412' },
  'Treasure Hunt': { bg: '#f0fdfa', bd: '#0d9488', ft: '#134e4a' },
};

// Group colors: 0=red,1=amber,2=blue,3=purple,4=green,5=indigo
const GRP_S = [
  { bg: '#fef2f2', bd: '#ef4444', ft: '#7f1d1d' },
  { bg: '#fffbeb', bd: '#f59e0b', ft: '#78350f' },
  { bg: '#eff6ff', bd: '#3b82f6', ft: '#1e3a8a' },
  { bg: '#fdf4ff', bd: '#a855f7', ft: '#581c87' },
  { bg: '#f0fdf4', bd: '#22c55e', ft: '#14532d' },
  { bg: '#eef2ff', bd: '#6366f1', ft: '#1e1b4b' },
];

function gameVis(game) {
  const s = GAME_S[game];
  return { shape:'box', borderWidth:2, margin:6, widthConstraint:{minimum:100},
    color:{background:s.bg, border:s.bd, highlight:{background:s.bg, border:'#1e293b'}},
    font:{color:s.ft, size:11, face:'Segoe UI'},
    shadow:{enabled:true, color:'#00000012', size:5} };
}
function grpVis(grp) {
  const s = GRP_S[grp];
  return { shape:'box', borderWidth:2, margin:6, widthConstraint:{minimum:100},
    color:{background:s.bg, border:s.bd, highlight:{background:s.bg, border:'#1e293b'}},
    font:{color:s.ft, size:11, face:'Segoe UI'},
    shadow:{enabled:true, color:'#00000012', size:5} };
}
function dimVis() {
  return { color:{background:'#f1f5f9', border:'#e2e8f0', highlight:{background:'#f1f5f9',border:'#e2e8f0'}},
    font:{color:'#dde1e7', size:11}, borderWidth:1, shadow:{enabled:false} };
}
const CONCEPT_VIS = { shape:'box', borderWidth:2, margin:8, widthConstraint:{minimum:105},
  color:{background:'#1e293b', border:'#475569', highlight:{background:'#0f172a',border:'#94a3b8'}},
  font:{color:'#f8fafc', size:11, face:'Segoe UI', bold:true},
  shadow:{enabled:true, color:'#00000033', size:10} };
const BREED_VIS = { shape:'box', borderWidth:2, margin:6, widthConstraint:{minimum:108},
  color:{background:'#fefce8', border:'#ca8a04', highlight:{background:'#fef9c3',border:'#92400e'}},
  font:{color:'#713f12', size:11, face:'Segoe UI'}, shadow:{enabled:true, color:'#ca8a0422', size:6},
  borderDashes:[4,3] };
const XBREED_VIS = { shape:'box', borderWidth:2, margin:6, widthConstraint:{minimum:108},
  color:{background:'#fff1f2', border:'#f43f5e', highlight:{background:'#ffe4e6',border:'#e11d48'}},
  font:{color:'#881337', size:11, face:'Segoe UI'}, shadow:{enabled:true, color:'#f43f5e22', size:6},
  borderDashes:[4,3] };

function edgeVis(type) {
  const map = {
    instance_of: { color:'#94a3b8', width:1.5, dashes:false },
    bred:        { color:'#ca8a04', width:1.5, dashes:[4,3] },
    cross_bred:  { color:'#f43f5e', width:1.5, dashes:[4,3] },
  };
  const s = map[type] || map.instance_of;
  return { color:{color:s.color, opacity:0.75}, width:s.width, dashes:s.dashes,
    arrows:{to:{enabled:true, scaleFactor:0.6}}, smooth:{type:'continuous'} };
}

// ═══════════════════════════════════════════════════════
// NODE / GROUP DATA
// ═══════════════════════════════════════════════════════

const GAME_NODES = [
  // Void Rush
  { id:'vr1', label:'Empty Hand',    game:'Void Rush',     grp:5, x:-390, y: 35 },
  { id:'vr2', label:'Play a Card',   game:'Void Rush',     grp:4, x:-270, y:185 },
  { id:'vr3', label:'Match Color',   game:'Void Rush',     grp:0, x:-335, y:-230 },
  { id:'vr4', label:'Wild Card',     game:'Void Rush',     grp:1, x: 265, y:-230 },
  { id:'vr5', label:'Draw 2 Card',   game:'Void Rush',     grp:2, x: 365, y: 25 },
  { id:'vr6', label:'Skip Turn',     game:'Void Rush',     grp:3, x: 215, y:230 },
  // Battle Deck
  { id:'bd1', label:'Defeat Opp.',   game:'Battle Deck',   grp:5, x:-345, y: 72 },
  { id:'bd2', label:'Play Atk Card', game:'Battle Deck',   grp:4, x:-230, y:222 },
  { id:'bd3', label:'Match Element', game:'Battle Deck',   grp:0, x:-278, y:-200 },
  { id:'bd4', label:'Elemental Wild',game:'Battle Deck',   grp:1, x: 325, y:-196 },
  { id:'bd5', label:'Draw Power',    game:'Battle Deck',   grp:2, x: 328, y: 65 },
  { id:'bd6', label:'Block Move',    game:'Battle Deck',   grp:3, x: 278, y:268 },
  // Treasure Hunt
  { id:'th1', label:'Collect Sets',  game:'Treasure Hunt', grp:5, x:-388, y: 78 },
  { id:'th2', label:'Play Set Card', game:'Treasure Hunt', grp:4, x:-285, y:238 },
  { id:'th3', label:'Match Suit',    game:'Treasure Hunt', grp:0, x:-300, y:-263 },
  { id:'th4', label:'Wild Treasure', game:'Treasure Hunt', grp:1, x: 298, y:-265 },
  { id:'th5', label:'Draw Bonus',    game:'Treasure Hunt', grp:2, x: 378, y: 70 },
  { id:'th6', label:'Skip Opponent', game:'Treasure Hunt', grp:3, x: 258, y:222 },
];

// Group centroids
const GRP_INFO = {
  0:{ label:'Matching\nMechanic',   cx:-304, cy:-231, nodes:['vr3','bd3','th3'] },
  1:{ label:'Wild Card\nEffect',    cx: 296, cy:-230, nodes:['vr4','bd4','th4'] },
  2:{ label:'Forced\nDraw',         cx: 357, cy:  53, nodes:['vr5','bd5','th5'] },
  3:{ label:'Turn\nDisruption',     cx: 250, cy: 240, nodes:['vr6','bd6','th6'] },
  4:{ label:'Card Play\nAction',    cx:-262, cy: 215, nodes:['vr2','bd2','th2'] },
  5:{ label:'Win\nCondition',       cx:-374, cy:  62, nodes:['vr1','bd1','th1'] },
};

// ═══════════════════════════════════════════════════════
// STEPS
// ═══════════════════════════════════════════════════════

const STEPS = [
// ── 0 ────────────────────────────────────────────────
{
  title: 'Step 0: Load Mechanics from 3 Games',
  ctx: 'Scatter view — colored by source game',
  addNodes: GAME_NODES.map(n => ({ id:n.id, label:n.label, x:n.x, y:n.y, fixed:{x:true,y:true}, ...gameVis(n.game), _gn:true, _grp:n.grp })),
  addEdges: [],
  recolorByGroup: false,
  addGroupLabels: false,
  highlightGroups: [],
  dimOthers: false,
  legendMode: 'game',
  prompt: {
    text:`<span class="hl-header">TASK</span>: Encode each game mechanic as a dense vector
embedding for semantic similarity comparison.

<span class="hl-key">Input mechanics</span> (18 total across 3 games):

<span class="hl-var">Void Rush</span>:
  Empty Hand, Play a Card, Match Color,
  Wild Card, Draw 2 Card, Skip Turn

<span class="hl-var">Battle Deck</span>:
  Defeat Opp., Play Atk Card, Match Element,
  Elemental Wild, Draw Power, Block Move

<span class="hl-var">Treasure Hunt</span>:
  Collect Sets, Play Set Card, Match Suit,
  Wild Treasure, Draw Bonus, Skip Opponent`,
  },
  response: null,
  chips: [],
},
// ── 1 ────────────────────────────────────────────────
{
  title: 'Step 1: Cluster by Semantic Similarity',
  ctx: 'Hierarchical clustering with cosine distance threshold = 0.4',
  addNodes: [],
  addEdges: [],
  recolorByGroup: true,
  addGroupLabels: false,
  highlightGroups: [],
  dimOthers: false,
  legendMode: 'group',
  prompt: {
    text:`<span class="hl-header">PROCESS</span>: Hierarchical clustering (average linkage,
cosine distance) with threshold <span class="hl-key">t = 0.4</span>.

<span class="hl-json">Z = linkage(embeddings, metric='cosine', method='average')
clusters = fcluster(Z, t=0.4, criterion='distance')</span>

<span class="hl-header">RESULT</span>: 6 clusters discovered.`,
  },
  response: `<span class="hl-json">{
  Cluster 0 → Match Color, Match Element, Match Suit
  Cluster 1 → Wild Card, Elemental Wild, Wild Treasure
  Cluster 2 → Draw 2 Card, Draw Power, Draw Bonus
  Cluster 3 → Skip Turn, Block Move, Skip Opponent
  Cluster 4 → Play a Card, Play Atk Card, Play Set Card
  Cluster 5 → Empty Hand, Defeat Opp., Collect Sets
}</span>

<span style="color:#94a3b8">// Cluster names unknown — to be determined in next steps.</span>`,
  chips: [],
},
// ── 2 ────────────────────────────────────────────────
{
  title: 'Step 2: Summarize Group 0 — "Matching Mechanic"',
  ctx: 'Sending instance_summary prompt for Group 0',
  addNodes: [],
  addEdges: [],
  recolorByGroup: false,
  addGroupLabels: false,
  highlightGroups: [0],
  dimOthers: true,
  legendMode: 'group',
  prompt: {
    text:`<span class="hl-header">PROMPT</span>: <span class="hl-key">instance_summary</span>

You are an assistant summarizing game concepts from
a list of gameplay mechanic instances.

<span class="hl-header">INPUT</span>
<span class="hl-var">### Instance 0: Match Color
A card can be played if its color matches the top
discard pile card.

### Instance 1: Match Element
A card is valid if its element type matches the
currently active element on the field.

### Instance 2: Match Suit
Play a card only if its suit matches the
current trick suit or is a trump card.</span>

<span class="hl-header">OUTPUT FORMAT</span>
<span class="hl-json">{
  "name": "&lt;concept name&gt;",
  "description": {
    "common":    "&lt;shared core across instances&gt;",
    "variation": "&lt;how instances differ&gt;"
  }
}</span>`,
  },
  response: null,
  chips: [],
},
// ── 3 ────────────────────────────────────────────────
{
  title: 'Step 3: Group 0 Abstraction Returned',
  ctx: 'Concept node created; instances linked',
  addNodes: [
    { id:'c0', label:'Matching\nMechanic', x:-304, y:-231, fixed:{x:true,y:true}, ...CONCEPT_VIS, _cgrp:0 },
  ],
  addEdges: [
    { id:'e-vr3-c0', from:'vr3', to:'c0', ...edgeVis('instance_of') },
    { id:'e-bd3-c0', from:'bd3', to:'c0', ...edgeVis('instance_of') },
    { id:'e-th3-c0', from:'th3', to:'c0', ...edgeVis('instance_of') },
  ],
  recolorByGroup: false,
  addGroupLabels: false,
  highlightGroups: [0],
  dimOthers: true,
  legendMode: 'group',
  prompt: null,
  response: `<span class="hl-json">{
  "name": "<span class="hl-node">Matching Mechanic</span>",
  "description": {
    "common":
      "A play condition requiring one attribute of
       the card (color, element, suit) to align
       with an active reference value on the field.",
    "variation":
      "Instances differ in which attribute is matched
       (color vs. element vs. suit) and whether
       trump/wild overrides apply."
  }
}</span>`,
  chips: [{ label:'Matching Mechanic', color:'#7f1d1d', bg:'#fef2f2', bd:'#ef4444' }],
},
// ── 4 ────────────────────────────────────────────────
{
  title: 'Step 4: Breed New Mechanics from Group 0',
  ctx: 'entity_design prompt → 3 novel instances generated',
  addNodes: [
    { id:'b0a', label:'Rank+Color\nDual Match',   x:-410, y:-300, fixed:{x:true,y:true}, ...BREED_VIS },
    { id:'b0b', label:'Element\nCascade',          x:-304, y:-320, fixed:{x:true,y:true}, ...BREED_VIS },
    { id:'b0c', label:'Wild\nOverride',            x:-195, y:-300, fixed:{x:true,y:true}, ...BREED_VIS },
  ],
  addEdges: [
    { id:'e-c0-b0a', from:'c0', to:'b0a', ...edgeVis('bred') },
    { id:'e-c0-b0b', from:'c0', to:'b0b', ...edgeVis('bred') },
    { id:'e-c0-b0c', from:'c0', to:'b0c', ...edgeVis('bred') },
  ],
  recolorByGroup: false,
  addGroupLabels: false,
  highlightGroups: [0],
  dimOthers: true,
  legendMode: 'group',
  prompt: {
    text:`<span class="hl-header">PROMPT</span>: <span class="hl-key">entity_design</span>

<span class="hl-var">[prefix]</span> You are a creative card game designer
exploring unusual mechanic combinations.

Now design a novel concept instance that:
- Serves the same theme: <span class="hl-node">Matching Mechanic</span>
- Is meaningfully different from all given instances
- Follows the writing style of the instances

<span class="hl-json">{
  "name": "...",
  "description": "One concise sentence."
}</span>

Then: <span class="hl-key">"Design another one"</span> × 2`,
  },
  response: `<span class="hl-json">① { "name": "<span class="hl-node">Rank+Color Dual Match</span>",
   "description": "A card is only playable if BOTH
   its rank and color match the discard — stricter
   but rewards bonus draw on success." }

② { "name": "<span class="hl-node">Element Cascade</span>",
   "description": "Matching the active element lets
   you chain-play additional same-element cards
   from your hand that turn." }

③ { "name": "<span class="hl-node">Wild Override</span>",
   "description": "A wild card nullifies the current
   match requirement for one turn, allowing any
   card to be played." }</span>`,
  chips: [
    { label:'Rank+Color Dual Match', color:'#7f1d1d', bg:'#fef2f2', bd:'#ef4444' },
    { label:'Element Cascade',       color:'#7f1d1d', bg:'#fef2f2', bd:'#ef4444' },
    { label:'Wild Override',         color:'#7f1d1d', bg:'#fef2f2', bd:'#ef4444' },
  ],
},
// ── 5 ────────────────────────────────────────────────
{
  title: 'Step 5: Synthesize Group 1 — "Wild Card Effect"',
  ctx: 'instance_summary + entity_design for Group 1',
  addNodes: [
    { id:'c1', label:'Wild Card\nEffect',  x: 296, y:-230, fixed:{x:true,y:true}, ...CONCEPT_VIS, _cgrp:1 },
    { id:'b1a', label:'Color Bomb\nWild',  x: 210, y:-315, fixed:{x:true,y:true}, ...BREED_VIS },
    { id:'b1b', label:'Double Wild\nChain',x: 296, y:-330, fixed:{x:true,y:true}, ...BREED_VIS },
    { id:'b1c', label:'Curse Wild',        x: 385, y:-315, fixed:{x:true,y:true}, ...BREED_VIS },
  ],
  addEdges: [
    { id:'e-vr4-c1', from:'vr4', to:'c1', ...edgeVis('instance_of') },
    { id:'e-bd4-c1', from:'bd4', to:'c1', ...edgeVis('instance_of') },
    { id:'e-th4-c1', from:'th4', to:'c1', ...edgeVis('instance_of') },
    { id:'e-c1-b1a', from:'c1', to:'b1a', ...edgeVis('bred') },
    { id:'e-c1-b1b', from:'c1', to:'b1b', ...edgeVis('bred') },
    { id:'e-c1-b1c', from:'c1', to:'b1c', ...edgeVis('bred') },
  ],
  recolorByGroup: false,
  addGroupLabels: false,
  highlightGroups: [1],
  dimOthers: true,
  legendMode: 'group',
  prompt: {

// ═══════════════════════════════════════════════════════
// vis.js NETWORK
// ═══════════════════════════════════════════════════════

const nodesDS = new vis.DataSet([]);
const edgesDS = new vis.DataSet([]);
const container = document.getElementById('graph-container');
const network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, {
  width: '100%', height: '100%',
  layout: { hierarchical: { enabled: false } },
  physics: { enabled: false },
  interaction: { hover: true, tooltipDelay: 200, zoomView: true, dragView: true },
});

window.addEventListener('load',   () => { network.redraw(); network.fit(); });
window.addEventListener('resize', () => { network.redraw(); network.fit(); });

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════

let currentStep = -1;

// Track whether group-recoloring has happened
let isGroupPhase = false;
// Track which group label nodes exist
let groupLabelsAdded = false;

function baseStyle(nodeId) {
  const gn = GAME_NODES.find(n => n.id === nodeId);
  if (!gn) return null;
  return isGroupPhase ? grpVis(gn._grp ?? gn.grp) : gameVis(gn.game);
}

// ═══════════════════════════════════════════════════════
// APPLY STEP (cumulative replay)
// ═══════════════════════════════════════════════════════

function replayUpTo(idx) {
  // Full reset
  nodesDS.clear();
  edgesDS.clear();
  isGroupPhase = false;
  groupLabelsAdded = false;

  for (let i = 0; i <= idx; i++) {
    const s = STEPS[i];

    // Add nodes
    s.addNodes.forEach(n => {
      if (!nodesDS.get(n.id)) nodesDS.add(n);
    });

    // Add edges
    s.addEdges.forEach(e => {
      if (!edgesDS.get(e.id)) edgesDS.add(e);
    });

    // Recolor game nodes to group colors
    if (s.recolorByGroup) {
      isGroupPhase = true;
      GAME_NODES.forEach(n => {
        if (nodesDS.get(n.id)) nodesDS.update({ id: n.id, ...grpVis(n.grp) });
      });
    }

    // Add group labels
    if (s.addGroupLabels && !groupLabelsAdded) {
      groupLabelsAdded = true;
      Object.entries(GRP_INFO).forEach(([grp, info]) => {
        const gs = GRP_S[+grp];
        nodesDS.add({
          id: `gl${grp}`,
          label: info.label,
          x: info.cx, y: info.cy - 48,
          fixed: {x:true, y:true},
          shape: 'text',
          font: { color: gs.bd, size: 10, bold: true, face: 'Segoe UI' },
          physics: false,
        });
      });
    }
  }

  // Apply final highlight/dim state
  const s = STEPS[idx];
  applyHighlight(s.highlightGroups, s.dimOthers);
}

function applyHighlight(highlightGroups, dimOthers) {
  if (!dimOthers || highlightGroups.length === 0) {
    // Restore all game nodes to current base style
    GAME_NODES.forEach(n => {
      if (nodesDS.get(n.id)) {
        const style = isGroupPhase ? grpVis(n.grp) : gameVis(n.game);
        nodesDS.update({ id: n.id, ...style });
      }
    });
    // Restore group label visibility
    Object.keys(GRP_INFO).forEach(grp => {
      const lbl = nodesDS.get(`gl${grp}`);
      if (lbl) nodesDS.update({ id: `gl${grp}`, font: { color: GRP_S[+grp].bd, size: 10, bold: true, face:'Segoe UI' } });
    });
    return;
  }

  GAME_NODES.forEach(n => {
    if (!nodesDS.get(n.id)) return;
    if (highlightGroups.includes(n.grp)) {
      const gs = GRP_S[n.grp];
      nodesDS.update({ id: n.id, ...grpVis(n.grp),
        borderWidth: 3, shadow: { enabled: true, color: gs.bd + '44', size: 14 } });
    } else {
      nodesDS.update({ id: n.id, ...dimVis() });
    }
  });

  // Dim group labels that aren't highlighted
  Object.keys(GRP_INFO).forEach(grp => {
    const lbl = nodesDS.get(`gl${grp}`);
    if (!lbl) return;
    const dimmed = !highlightGroups.includes(+grp);
    nodesDS.update({ id: `gl${grp}`, font: { color: dimmed ? '#e2e8f0' : GRP_S[+grp].bd, size: 10, bold: true, face:'Segoe UI' } });
  });
}

// ═══════════════════════════════════════════════════════
// LEGEND
// ═══════════════════════════════════════════════════════

function updateLegend(mode) {
  document.getElementById('legend-title').textContent = mode === 'game' ? 'Games' : 'Groups';
  const body = document.getElementById('legend-body');
  body.innerHTML = '';
  if (mode === 'game') {
    Object.entries(GAME_S).forEach(([name, s]) => {
      body.innerHTML += `<div class="legend-row"><div class="legend-dot" style="background:${s.bg};border-color:${s.bd}"></div>${name}</div>`;
    });
    body.innerHTML += `<div style="margin-top:4px" class="legend-title">Nodes</div>
      <div class="legend-row"><div class="legend-swatch" style="background:#1e293b;border-color:#475569"></div>Concept</div>
      <div class="legend-row"><div class="legend-swatch" style="background:#fefce8;border-color:#ca8a04"></div>New Breed</div>
      <div class="legend-row"><div class="legend-swatch" style="background:#fff1f2;border-color:#f43f5e"></div>Cross-Breed</div>`;
  } else {
    const names = ['Matching','Wild Card','Forced Draw','Turn Disruption','Card Play','Win Condition'];
    GRP_S.forEach((s, i) => {
      body.innerHTML += `<div class="legend-row"><div class="legend-dot" style="background:${s.bg};border-color:${s.bd}"></div>${names[i]}</div>`;
    });
    body.innerHTML += `<div style="margin-top:4px" class="legend-title">Nodes</div>
      <div class="legend-row"><div class="legend-swatch" style="background:#1e293b;border-color:#475569"></div>Concept</div>
      <div class="legend-row"><div class="legend-swatch" style="background:#fefce8;border-color:#ca8a04"></div>New Breed</div>
      <div class="legend-row"><div class="legend-swatch" style="background:#fff1f2;border-color:#f43f5e"></div>Cross-Breed</div>`;
  }
}

// ═══════════════════════════════════════════════════════
// PROMPT PANEL
// ═══════════════════════════════════════════════════════

function renderCards() {
  const scroll = document.getElementById('prompt-scroll');
  scroll.innerHTML = '';
  STEPS.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'step-card pending';
    card.id = `sc-${i}`;
    const hdr = document.createElement('div');
    hdr.className = 'step-card-header';
    hdr.innerHTML = `<div class="step-num">${i}</div><div class="step-title">${s.title}</div>`;
    hdr.addEventListener('click', () => jumpToStep(i));
    card.appendChild(hdr);
    const body = document.createElement('div');
    body.className = 'step-body';
    body.innerHTML = `<div class="ctx-row"><span class="ctx-tag">Context</span><span style="color:#64748b;font-size:10px">${s.ctx}</span></div>`;
    if (s.prompt) {
      body.innerHTML += `<div class="prompt-block"><div class="prompt-label label-user">User Prompt</div><div class="prompt-text">${s.prompt.text}</div></div>`;
    }
    if (s.response) {
      body.innerHTML += `<div class="response-block">${s.response}</div>`;
    }
    if (s.chips.length) {
      const chips = s.chips.map(c => `<span class="chip" style="background:${c.bg};border-color:${c.bd};color:${c.color}">${c.label}</span>`).join('');
      body.innerHTML += `<div class="chips">${chips}</div>`;
    }
    card.appendChild(body);
    scroll.appendChild(card);
  });
}

function updateCards(upTo) {
  STEPS.forEach((_, i) => {
    const card = document.getElementById(`sc-${i}`);
    if (i < upTo)       card.className = 'step-card done';
    else if (i === upTo){ card.className = 'step-card active'; setTimeout(() => card.scrollIntoView({behavior:'smooth',block:'nearest'}), 100); }
    else                 card.className = 'step-card pending';
  });
}

function updateProgress(step) {
  const total = STEPS.length - 1;
  document.getElementById('progress-fill').style.width = (step / total * 100) + '%';
  document.getElementById('step-counter').textContent = `${step} / ${total}`;
}

function syncButtons(step) {
  document.getElementById('btn-prev').disabled = step <= 0;
  const btnNext = document.getElementById('btn-next');
  if (step >= STEPS.length - 1) { btnNext.textContent = '✓ Complete'; btnNext.disabled = true; }
  else { btnNext.textContent = 'Next Step →'; btnNext.disabled = false; }
}

// ═══════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════

function jumpToStep(idx) {
  replayUpTo(idx);
  currentStep = idx;
  updateCards(idx);
  updateProgress(idx);
  syncButtons(idx);
  updateLegend(STEPS[idx].legendMode);
  setTimeout(() => network.fit({ animation: { duration: 500, easingFunction: 'easeInOutQuad' } }), 60);
}

function nextStep() {
  if (currentStep >= STEPS.length - 1) return;
  jumpToStep(currentStep + 1);
}

function reset() {
  nodesDS.clear(); edgesDS.clear();
  isGroupPhase = false; groupLabelsAdded = false;
  currentStep = -1;
  STEPS.forEach((_, i) => { document.getElementById(`sc-${i}`).className = 'step-card pending'; });
  updateProgress(0);
  syncButtons(-1);
  updateLegend('game');
  network.fit({ animation: { duration: 400 } });
}

document.getElementById('btn-next').addEventListener('click', nextStep);
document.getElementById('btn-prev').addEventListener('click', () => { if (currentStep > 0) jumpToStep(currentStep - 1); });
document.getElementById('btn-reset').addEventListener('click', reset);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextStep(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); if (currentStep > 0) jumpToStep(currentStep - 1); }
  if (e.key === 'r' || e.key === 'R') reset();
});

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
renderCards();
jumpToStep(0);
</script>
