<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Variation — Cardiverse</title>
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f1f5f9; color: #1e293b; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .main { display: flex; flex: 1; overflow: hidden; min-height: 0; }

    .left-panel { flex: 1 1 56%; min-width: 0; min-height: 0; display: flex; flex-direction: column; border-right: 1px solid #e2e8f0; position: relative; }
    .panel-header { background: #f8fafc; padding: 10px 18px; font-size: 11px; font-weight: 700; color: #94a3b8; letter-spacing: 0.8px; text-transform: uppercase; border-bottom: 1px solid #e2e8f0; flex-shrink: 0; }
    #graph-container { flex: 1; min-height: 0; background: #f8fafc; position: relative; overflow: hidden; }
    #graph-container canvas { display: block; }

    /* Text view overlay */
    #text-view {
      display: none;
      position: absolute;
      top: 34px; left: 0; right: 0; bottom: 0;
      background: #f8fafc;
      overflow-y: auto;
      padding: 32px 40px;
      z-index: 20;
    }
    #text-view::-webkit-scrollbar { width: 5px; }
    #text-view::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    .doc-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 28px 32px;
      max-width: 580px;
      margin: 0 auto;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .doc-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .doc-title {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }
    .doc-subtitle {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    .doc-section {
      margin-bottom: 16px;
    }
    .doc-section-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .doc-body {
      font-size: 13px;
      line-height: 1.75;
      color: #334155;
      white-space: pre-wrap;
    }
    .doc-body .ins { background: #d1fae5; color: #065f46; border-radius: 2px; padding: 0 2px; }
    .doc-body .del { background: #fee2e2; color: #991b1b; border-radius: 2px; padding: 0 2px; text-decoration: line-through; }
    .doc-divider { border: none; border-top: 1px solid #f1f5f9; margin: 18px 0; }

    .right-panel { flex: 0 0 44%; display: flex; flex-direction: column; overflow: hidden; background: #fff; }
    .prompt-scroll { flex: 1; overflow-y: auto; padding: 14px; background: #f8fafc; }
    .prompt-scroll::-webkit-scrollbar { width: 5px; }
    .prompt-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

    .step-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 9px; margin-bottom: 10px; overflow: hidden; transition: border-color 0.3s, box-shadow 0.3s; }
    .step-card.active { border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99,102,241,0.1), 0 4px 16px rgba(99,102,241,0.1); }
    .step-card.done { opacity: 0.5; }
    .step-card-header { display: flex; align-items: center; gap: 9px; padding: 9px 13px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; cursor: pointer; user-select: none; transition: background 0.15s; }
    .step-card-header:hover { background: #f1f5f9; }
    .step-num { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
    .step-card.active  .step-num { background: #6366f1; color: #fff; }
    .step-card.done    .step-num { background: #dcfce7; color: #16a34a; border: 1px solid #86efac; }
    .step-card.pending .step-num { background: #f1f5f9; color: #94a3b8; border: 1px solid #e2e8f0; }
    .step-title { font-size: 12px; font-weight: 600; color: #1e293b; flex: 1; }
    .step-card.done    .step-title,
    .step-card.pending .step-title { color: #94a3b8; }
    .step-body { padding: 11px 13px; display: none; }
    .step-card.active .step-body, .step-card.expanded .step-body { display: block; }

    .ctx-row { display: flex; align-items: center; gap: 7px; margin-bottom: 9px; }
    .ctx-tag { background: #eff6ff; border: 1px solid #bfdbfe; color: #2563eb; border-radius: 4px; padding: 2px 7px; font-size: 10px; font-weight: 700; }
    .ctx-text { color: #64748b; font-size: 10px; }

    .prompt-block { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; overflow: hidden; margin-bottom: 9px; }
    .prompt-label { padding: 4px 9px; font-size: 9px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; border-bottom: 1px solid #e2e8f0; }
    .label-user   { color: #2563eb; background: #eff6ff; }
    .label-llm    { color: #059669; background: #f0fdf4; }
    .label-system { color: #7c3aed; background: #f5f3ff; }
    .prompt-text { padding: 9px; font-size: 11px; line-height: 1.65; color: #475569; white-space: pre-wrap; font-family: 'Consolas', 'Fira Code', monospace; }
    .prompt-text .hl-header { color: #0f172a; font-weight: 700; }
    .prompt-text .hl-key    { color: #4f46e5; }
    .prompt-text .hl-var    { color: #d97706; font-weight: 600; }
    .prompt-text .hl-json   { color: #059669; }
    .prompt-text .hl-node   { color: #dc2626; font-weight: 600; }
    .prompt-text .hl-new    { color: #0d9488; font-weight: 600; }
    .prompt-text .hl-del    { color: #94a3b8; text-decoration: line-through; }
    .response-block { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 6px; padding: 9px; font-size: 11px; line-height: 1.65; color: #065f46; font-family: 'Consolas', 'Fira Code', monospace; white-space: pre-wrap; margin-bottom: 9px; }

    .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .chip { padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; border: 1px solid; }

    .controls { background: #fff; border-top: 1px solid #e2e8f0; padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .btn { padding: 6px 15px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; transition: background 0.15s, transform 0.1s; }
    .btn:active { transform: scale(0.97); }
    .btn-primary   { background: #6366f1; color: #fff; }
    .btn-primary:hover   { background: #4f46e5; }
    .btn-primary:disabled  { background: #e2e8f0; color: #94a3b8; cursor: not-allowed; }
    .btn-secondary { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
    .btn-secondary:hover  { background: #e2e8f0; }
    .btn-secondary:disabled { color: #cbd5e1; cursor: not-allowed; }
    .progress-bar { flex: 1; height: 4px; background: #e2e8f0; border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #6366f1, #8b5cf6); border-radius: 2px; transition: width 0.4s ease; }
    .step-counter { font-size: 11px; color: #94a3b8; white-space: nowrap; }

    /* Legend */
    .legend { position: absolute; bottom: 12px; left: 12px; background: rgba(255,255,255,0.93); border: 1px solid #e2e8f0; border-radius: 8px; padding: 9px 13px; font-size: 10px; display: flex; flex-direction: column; gap: 5px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
    .legend-title { font-weight: 700; color: #94a3b8; letter-spacing: 0.5px; text-transform: uppercase; font-size: 9px; margin-bottom: 1px; }
    .legend-row { display: flex; align-items: center; gap: 7px; color: #475569; }
    .legend-dot  { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; border: 2px solid; }
    .legend-line { width: 16px; height: 2px; border-radius: 1px; flex-shrink: 0; }
  </style>
</head>
<body>
<div class="main">
  <div class="left-panel">
    <div class="panel-header">Game Variation — Void Rush</div>
    <div id="text-view"></div>
    <div id="graph-container">
      <div class="legend">
        <div class="legend-title">Nodes</div>
        <div class="legend-row"><div class="legend-dot" style="background:#f1f5f9;border-color:#6b7280"></div>Goal</div>
        <div class="legend-row"><div class="legend-dot" style="background:#ede9fe;border-color:#6366f1"></div>Depth 0 — Win Conditions</div>
        <div class="legend-row"><div class="legend-dot" style="background:#e0f2fe;border-color:#0ea5e9"></div>Depth 1 — Key Mechanics</div>
        <div class="legend-row"><div class="legend-dot" style="background:#dcfce7;border-color:#22c55e"></div>Depth 2 — Sub-Mechanics</div>
        <div class="legend-row"><div class="legend-dot" style="background:#fef3c7;border-color:#f59e0b"></div>Popular (selected)</div>
        <div class="legend-row"><div class="legend-dot" style="background:#fefce8;border-color:#ca8a04"></div>Bred candidate</div>
        <div class="legend-row"><div class="legend-dot" style="background:#fdf2f8;border-color:#a855f7"></div>Counterpart candidate</div>
        <div class="legend-row"><div class="legend-dot" style="background:#f0fdf4;border-color:#10b981"></div>Integrated new node</div>
        <div class="legend-row"><div class="legend-dot" style="background:#f8fafc;border-color:#cbd5e1"></div>Deprecated</div>
        <div style="margin-top:4px" class="legend-title">Edges</div>
        <div class="legend-row"><div class="legend-line" style="background:#22c55e"></div>Contribute</div>
        <div class="legend-row"><div class="legend-line" style="background:#f59e0b"></div>Mixed</div>
        <div class="legend-row"><div class="legend-line" style="background:#a855f7;border-top:1px dashed #a855f7;height:0"></div>Inspires</div>
      </div>
    </div>
  </div>
  <div class="right-panel">
    <div class="panel-header">LLM Prompts &amp; Responses</div>
    <div class="prompt-scroll" id="prompt-scroll"></div>
    <div class="controls">
      <button class="btn btn-secondary" id="btn-reset">Reset</button>
      <button class="btn btn-secondary" id="btn-prev" disabled>← Prev</button>
      <button class="btn btn-primary"   id="btn-next">Next Step →</button>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <span class="step-counter" id="step-counter">0 / 6</span>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// NODE STYLE HELPERS
// ═══════════════════════════════════════════════════════

const DEPTH_VIS = {
  goal: { bg:'#f1f5f9', bd:'#6b7280', ft:'#374151' },
  0:    { bg:'#ede9fe', bd:'#6366f1', ft:'#3730a3' },
  1:    { bg:'#e0f2fe', bd:'#0ea5e9', ft:'#0369a1' },
  2:    { bg:'#dcfce7', bd:'#22c55e', ft:'#15803d' },
};

function depthVis(depth) {
  const s = DEPTH_VIS[depth] ?? DEPTH_VIS[2];
  return { shape:'box', borderWidth:2, margin:7, widthConstraint:{minimum:100},
    color:{background:s.bg, border:s.bd, highlight:{background:s.bg, border:'#1e293b'}},
    font:{color:s.ft, size:11, face:'Segoe UI'},
    shadow:{enabled:true, color:'#00000012', size:5} };
}

const POPULAR_VIS = {
  shape:'box', borderWidth:3, margin:7, widthConstraint:{minimum:100},
  color:{background:'#fef3c7', border:'#f59e0b', highlight:{background:'#fef9c3', border:'#92400e'}},
  font:{color:'#78350f', size:11, face:'Segoe UI', bold:true},
  shadow:{enabled:true, color:'#f59e0b44', size:14}
};

const SELECTED_VIS = {
  shape:'box', borderWidth:5, margin:7, widthConstraint:{minimum:100},
  color:{background:'#fef3c7', border:'#f59e0b', highlight:{background:'#fef9c3', border:'#92400e'}},
  font:{color:'#78350f', size:11, face:'Segoe UI', bold:true},
  shadow:{enabled:true, color:'#f59e0b88', size:22}
};

const BRED_CAND_VIS = {
  shape:'box', borderWidth:2, margin:7, widthConstraint:{minimum:108},
  color:{background:'#fefce8', border:'#ca8a04', highlight:{background:'#fef9c3', border:'#92400e'}},
  font:{color:'#713f12', size:11, face:'Segoe UI'},
  shadow:{enabled:true, color:'#ca8a0430', size:8},
  borderDashes:[4,3]
};

const COUNTER_CAND_VIS = {
  shape:'box', borderWidth:2, margin:7, widthConstraint:{minimum:108},
  color:{background:'#fdf4ff', border:'#a855f7', highlight:{background:'#faf5ff', border:'#7e22ce'}},
  font:{color:'#581c87', size:11, face:'Segoe UI'},
  shadow:{enabled:true, color:'#a855f730', size:8},
  borderDashes:[4,3]
};

const SELECTED_CAND_VIS = {
  shape:'box', borderWidth:5, margin:7, widthConstraint:{minimum:108},
  color:{background:'#fefce8', border:'#ca8a04', highlight:{background:'#fef9c3', border:'#92400e'}},
  font:{color:'#713f12', size:11, face:'Segoe UI', bold:true},
  shadow:{enabled:true, color:'#ca8a0488', size:22}
};

const INTEGRATED_VIS = {
  shape:'box', borderWidth:2.5, margin:7, widthConstraint:{minimum:108},
  color:{background:'#f0fdf4', border:'#10b981', highlight:{background:'#ecfdf5', border:'#065f46'}},
  font:{color:'#065f46', size:11, face:'Segoe UI', bold:true},
  shadow:{enabled:true, color:'#10b98144', size:12}
};

const DIM_VIS = {
  color:{background:'#f1f5f9', border:'#cbd5e1', highlight:{background:'#f1f5f9', border:'#94a3b8'}},
  font:{color:'#94a3b8'},
  shadow:{enabled:false}
};

const DEPRECATED_VIS = {
  shape:'box', borderWidth:1, margin:7, widthConstraint:{minimum:100},
  color:{background:'#f8fafc', border:'#cbd5e1', highlight:{background:'#f8fafc', border:'#94a3b8'}},
  font:{color:'#94a3b8', size:10, face:'Segoe UI'},
  shadow:{enabled:false},
  borderDashes:[3,3]
};

function edgeVis(type) {
  const styles = {
    contribute: { color:'#22c55e', width:1.8, dashes:false },
    mixed:      { color:'#f59e0b', width:1.8, dashes:false },
    inspires:   { color:'#a855f7', width:1.8, dashes:[5,3] },
    new_edge:   { color:'#10b981', width:2,   dashes:false },
  };
  const s = styles[type] || styles.contribute;
  return { color:{color:s.color, opacity:0.8}, width:s.width, dashes:s.dashes,
    arrows:{to:{enabled:true, scaleFactor:0.7}},
    smooth:{type:'curvedCW', roundness:0.15} };
}

// ═══════════════════════════════════════════════════════
// GRAPH NODE DEFINITIONS
// ═══════════════════════════════════════════════════════

// Fixed positions (physics disabled)
const INIT_NODES = [
  { id:'goal', label:'End Game\n(Win)', x:0,    y:-270, _depth:'goal' },
  { id:'n_eh', label:'Empty Hand',      x:-170, y:-130, _depth:0 },
  { id:'n_bo', label:'Block Opponent',  x:170,  y:-130, _depth:0 },
  { id:'n_pac',label:'Play a Card',     x:-265, y: 30,  _depth:1 },

  { id:'n_d2', label:'Draw 2 Card',     x: 80,  y:190,  _depth:2 },

const INIT_EDGES = [
  { id:'e1',  from:'n_eh',  to:'goal',  ...edgeVis('contribute') },
  { id:'e2',  from:'n_bo',  to:'goal',  ...edgeVis('mixed') },
  { id:'e3',  from:'n_pac', to:'n_eh',  ...edgeVis('contribute') },
  { id:'e4',  from:'n_uac', to:'n_eh',  ...edgeVis('contribute') },
  { id:'e5',  from:'n_fd',  to:'n_bo',  ...edgeVis('contribute') },
  { id:'e6',  from:'n_st',  to:'n_bo',  ...edgeVis('contribute') },
  { id:'e7',  from:'n_mc',  to:'n_pac', ...edgeVis('contribute') },
  { id:'e8',  from:'n_mn',  to:'n_pac', ...edgeVis('contribute') },
  { id:'e9',  from:'n_wc',  to:'n_uac', ...edgeVis('contribute') },
  { id:'e10', from:'n_d2',  to:'n_fd',  ...edgeVis('contribute') },
];

// Popularity scores
const POPULARITY = {
  'n_mc': 0.58, 'n_pac': 0.42, 'n_st': 0.35,
  'n_mn': 0.31, 'n_d2': 0.22, 'n_uac': 0.28,
  'n_fd': 0.21, 'n_wc': 0.19, 'n_eh': 0.45,
  'n_bo': 0.37, 'goal': null,
};

// STEPS
// ═══════════════════════════════════════════════════════

const ORIG_DOC_HTML = `

// ═══════════════════════════════════════════════════════
// vis.js SETUP
// ═══════════════════════════════════════════════════════

const nodesDS = new vis.DataSet([]);
const edgesDS = new vis.DataSet([]);
const container = document.getElementById('graph-container');

const network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, {
  width: '100%', height: '100%',
  layout: { hierarchical: { enabled: false } },
  physics: { enabled: false },
  interaction: { hover: true, tooltipDelay: 200, zoomView: true, dragView: true },
});

window.addEventListener('load',   () => { if (STEPS[currentStep]?.leftMode !== 'text') { network.redraw(); network.fit(); } });
window.addEventListener('resize', () => { if (STEPS[currentStep]?.leftMode !== 'text') { network.redraw(); network.fit(); } });

// ═══════════════════════════════════════════════════════
// STEP ENGINE
// ═══════════════════════════════════════════════════════

let currentStep = -1;

function replayUpTo(idx) {
  nodesDS.clear();
  edgesDS.clear();

  for (let i = 0; i <= idx; i++) {
    const s = STEPS[i];

    // Add nodes (skip if already exists — e.g. replayed updates)
    s.addNodes.forEach(n => {
      if (!nodesDS.get(n.id)) nodesDS.add(n);
    });

    // Add edges
    s.addEdges.forEach(e => {
      if (!edgesDS.get(e.id)) edgesDS.add(e);
    });

    // Apply updates
    s.updateNodes.forEach(u => {
      if (nodesDS.get(u.id)) nodesDS.update(u);
    });
  }
}

// ═══════════════════════════════════════════════════════
// PROMPT PANEL
// ═══════════════════════════════════════════════════════

function renderCards() {
  const scroll = document.getElementById('prompt-scroll');
  scroll.innerHTML = '';
  STEPS.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'step-card pending';
    card.id = `sc-${i}`;

    const hdr = document.createElement('div');
    hdr.className = 'step-card-header';
    hdr.innerHTML = `<div class="step-num">${i}</div><div class="step-title">${s.title}</div>`;
    hdr.addEventListener('click', () => jumpToStep(i));
    card.appendChild(hdr);

    const body = document.createElement('div');
    body.className = 'step-body';
    body.innerHTML = `<div class="ctx-row"><span class="ctx-tag">Context</span><span class="ctx-text">${s.ctx}</span></div>`;

    if (s.prompt) {
      body.innerHTML += `<div class="prompt-block">
        <div class="prompt-label ${s.prompt.cls}">${s.prompt.label}</div>
        <div class="prompt-text">${s.prompt.text}</div>
      </div>`;
    }
    if (s.response) {
      body.innerHTML += `<div class="response-block">${s.response}</div>`;
    }
    if (s.chips && s.chips.length) {
      const chips = s.chips.map(c =>
        `<span class="chip" style="background:${c.bg};border-color:${c.bd};color:${c.color}">${c.label}</span>`
      ).join('');
      body.innerHTML += `<div class="chips">${chips}</div>`;
    }

    card.appendChild(body);
    scroll.appendChild(card);
  });
}

function updateCards(upTo) {
  STEPS.forEach((_, i) => {
    const card = document.getElementById(`sc-${i}`);
    if (i < upTo)        card.className = 'step-card done';
    else if (i === upTo) { card.className = 'step-card active'; setTimeout(() => card.scrollIntoView({behavior:'smooth', block:'nearest'}), 100); }
    else                  card.className = 'step-card pending';
  });
}

function updateProgress(step) {
  const total = STEPS.length - 1;
  document.getElementById('progress-fill').style.width = (step / total * 100) + '%';
  document.getElementById('step-counter').textContent = `${step} / ${total}`;
}

function syncButtons(step) {
  document.getElementById('btn-prev').disabled = step <= 0;
  const btnNext = document.getElementById('btn-next');
  if (step >= STEPS.length - 1) { btnNext.textContent = '✓ Complete'; btnNext.disabled = true; }
  else { btnNext.textContent = 'Next Step →'; btnNext.disabled = false; }
}

// ═══════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════

function jumpToStep(idx) {
  replayUpTo(idx);
  currentStep = idx;
  updateCards(idx);
  updateProgress(idx);
  syncButtons(idx);
  // Toggle text view vs graph view
  const tv = document.getElementById('text-view');
  const step = STEPS[idx];
  const canvas = container.querySelector('canvas');
  if (step.leftMode === 'text') {
    tv.innerHTML = step.leftHTML;
    tv.style.display = 'block';
    if (canvas) canvas.style.visibility = 'hidden';
  } else {
    tv.style.display = 'none';
    tv.innerHTML = '';
    if (canvas) canvas.style.visibility = 'visible';
    setTimeout(() => network.fit({ animation: { duration: 500, easingFunction: 'easeInOutQuad' } }), 60);
  }
}

document.getElementById('btn-next').addEventListener('click', () => {
  if (currentStep < STEPS.length - 1) jumpToStep(currentStep + 1);
});
document.getElementById('btn-prev').addEventListener('click', () => {
  if (currentStep > 0) jumpToStep(currentStep - 1);
});
document.getElementById('btn-reset').addEventListener('click', () => {
  nodesDS.clear(); edgesDS.clear();
  currentStep = -1;
  STEPS.forEach((_, i) => { document.getElementById(`sc-${i}`).className = 'step-card pending'; });
  updateProgress(0);
  syncButtons(-1);
  network.fit({ animation: { duration: 400 } });
});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); if (currentStep < STEPS.length - 1) jumpToStep(currentStep + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); if (currentStep > 0) jumpToStep(currentStep - 1); }
  if (e.key === 'r' || e.key === 'R') document.getElementById('btn-reset').click();
});

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
renderCards();
jumpToStep(0);
</script>
