    const nodesLayer = document.getElementById("nodes-layer");
    const edgesLayer = document.getElementById("edges-layer");
    const edgeLabelsLayer = document.getElementById("edge-labels-layer");
    const promptScroll = document.getElementById("prompt-scroll");
    const progressFill = document.getElementById("progress-fill");
    const stepCounter = document.getElementById("step-counter");
    const btnPrev = document.getElementById("btn-prev");
    const btnNext = document.getElementById("btn-next");
    const btnReset = document.getElementById("btn-reset");
    let currentStep = 0;

    function escapeHtml(value) {
      return value.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
    }

    function highlightText(text) {
      let html = escapeHtml(text);
      html = html.replace(/`([^`]+)`/g, '<span class="hl-var">`$1`</span>');
      html = html.replace(/\b(create_game_code\.py|GameCode\/[A-Za-z0-9_./-]+|GameEngine\/[A-Za-z0-9_./-]+)\b/g, '<span class="hl-key">$1</span>');
      html = html.replace(/\b(create_with_repetition|create_pipeline|tasks_for_external_data|structurize_description|retrieve|naive_example_list|code_drafting|naive_refine|test_with_repetition|debug_code|validate_code|select_final_code|save_analysis_history|apply_edits)\b/g, '<span class="hl-node">$1</span>');
      html = html.replace(/\{([^}\n]+)\}/g, '{<span class="hl-json">$1</span>}');
      html = html.replace(/^(#{1,4} .+)$/gm, '<span class="hl-header">$1</span>');
      return html;
    }

    function renderGraph() {
      edgesLayer.innerHTML = "";
      edgeLabelsLayer.innerHTML = "";
      nodesLayer.innerHTML = "";
      GRAPH_EDGES.forEach((edge) => {
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("id", edge.id);
        path.setAttribute("d", edge.path);
        path.setAttribute("class", `graph-edge ${edge.loop ? "loop" : ""}`);
        path.setAttribute("marker-end", "url(#arrow-head)");
        edgesLayer.appendChild(path);
        const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
        label.setAttribute("id", `${edge.id}-label`);
        label.setAttribute("x", edge.x);
        label.setAttribute("y", edge.y);
        label.setAttribute("text-anchor", "middle");
        label.setAttribute("class", "edge-label");
        label.textContent = edge.label;
        edgeLabelsLayer.appendChild(label);
      });
      GRAPH_NODES.forEach((node) => {
        const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
        group.setAttribute("class", `graph-node kind-${node.kind}`);
        group.dataset.nodeId = node.id;
        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", node.x); rect.setAttribute("y", node.y);
        rect.setAttribute("width", node.w); rect.setAttribute("height", node.h);
        rect.setAttribute("rx", "16"); rect.setAttribute("ry", "16");
        const title = document.createElementNS("http://www.w3.org/2000/svg", "text");
        title.setAttribute("x", node.x + node.w / 2); title.setAttribute("y", node.y + 32);
        title.setAttribute("text-anchor", "middle"); title.setAttribute("class", "node-title"); title.textContent = node.title;
        const subtitle = document.createElementNS("http://www.w3.org/2000/svg", "text");
        subtitle.setAttribute("x", node.x + node.w / 2); subtitle.setAttribute("y", node.y + 56);
        subtitle.setAttribute("text-anchor", "middle"); subtitle.setAttribute("class", "node-subtitle"); subtitle.textContent = node.subtitle;
        group.append(rect, title, subtitle);
        group.addEventListener("click", () => jumpToNode(node.id));
        nodesLayer.appendChild(group);
      });
    }

    function jumpToNode(nodeId) {
      const idx = STEPS.findIndex((step) => step.nodes.includes(nodeId));
      if (idx >= 0) setStep(idx);
    }

    function renderSteps() {
      if (!STEPS.length) { promptScroll.innerHTML = ""; return; }
      promptScroll.innerHTML = STEPS.map((step, i) => {
        const state = i < currentStep ? "done" : i === currentStep ? "active" : "pending";
        const note = step.note ? `<div class="step-note">${escapeHtml(step.note)}</div>` : "";
        const tags = step.tags.map((tag) => `<span class="ctx-tag">${escapeHtml(tag)}</span>`).join("");
        const blocks = step.blocks.map((block) => {
          if (block.type === "response") return `<div class="response-block">${highlightText(block.text)}</div>`;
          const labelClass = block.type === "user" ? "label-user" : block.type === "llm" ? "label-llm" : "label-system";
          return `<div class="prompt-block"><div class="prompt-label ${labelClass}">${escapeHtml(block.label)}</div><div class="prompt-text">${highlightText(block.text)}</div></div>`;
        }).join("");
        const chips = step.chips.map((chip) => `<span class="chip ${chip.className}">${escapeHtml(chip.label)}</span>`).join("");
        return `<div class="step-card ${state}" data-step="${i}"><div class="step-card-header" data-step="${i}"><div class="step-num">${i + 1}</div><div class="step-title">${escapeHtml(step.title)}</div></div><div class="step-body">${note}<div class="ctx-row">${tags}<span class="ctx-text">${escapeHtml(step.summary)}</span></div>${blocks}<div class="chips">${chips}</div></div></div>`;
      }).join("");
      promptScroll.querySelectorAll(".step-card-header").forEach((el) => el.addEventListener("click", () => setStep(Number(el.dataset.step))));
    }

    function applyState() {
      if (!STEPS.length) return;
      const visitedNodes = new Set(), visitedEdges = new Set();
      for (let i = 0; i <= currentStep; i += 1) { STEPS[i].nodes.forEach((id) => visitedNodes.add(id)); STEPS[i].edges.forEach((id) => visitedEdges.add(id)); }
      const activeNodes = new Set(STEPS[currentStep].nodes), activeEdges = new Set(STEPS[currentStep].edges);
      GRAPH_NODES.forEach((node) => {
        const el = nodesLayer.querySelector(`[data-node-id="${node.id}"]`);
        if (!el) return;
        el.classList.remove("pending", "done", "active");
        el.classList.add(activeNodes.has(node.id) ? "active" : visitedNodes.has(node.id) ? "done" : "pending");
      });
      GRAPH_EDGES.forEach((edge) => {
        const els = [document.getElementById(edge.id), document.getElementById(`${edge.id}-label`)];
        els.forEach((el) => {
          if (!el) return;
          el.classList.remove("pending", "done", "active");
          el.classList.add(activeEdges.has(edge.id) ? "active" : visitedEdges.has(edge.id) ? "done" : "pending");
        });
      });
    }

    function updateControls() {
      if (!STEPS.length) {
        btnPrev.disabled = true; btnNext.disabled = true; progressFill.style.width = "0%"; stepCounter.textContent = "0 / 0"; return;
      }
      btnPrev.disabled = currentStep === 0;
      btnNext.disabled = currentStep === STEPS.length - 1;
      progressFill.style.width = `${((currentStep + 1) / STEPS.length) * 100}%`;
      stepCounter.textContent = `${currentStep + 1} / ${STEPS.length}`;
    }

    function setStep(index) {
      if (!STEPS.length) return;
      currentStep = Math.max(0, Math.min(index, STEPS.length - 1));
      renderSteps(); applyState(); updateControls();
      const active = promptScroll.querySelector(`.step-card[data-step="${currentStep}"]`);
      if (active) active.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }

    btnPrev.addEventListener("click", () => setStep(currentStep - 1));
    btnNext.addEventListener("click", () => setStep(currentStep + 1));
    btnReset.addEventListener("click", () => setStep(0));
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight") setStep(currentStep + 1);
      if (event.key === "ArrowLeft") setStep(currentStep - 1);
      if (event.key.toLowerCase() === "home") setStep(0);
    });

    renderGraph();
    if (STEPS.length) setStep(0);
    else { renderSteps(); updateControls(); }

    // ── Pan & Zoom ────────────────────────────────────────────────────────────
    (function () {
      const svg = document.getElementById("pipeline-graph");
      const vp  = document.getElementById("viewport");
      const container = document.getElementById("graph-container");

      // Initial transform: fit the 1240×700 content into the container
      const CONTENT_W = 1240, CONTENT_H = 700;
      let tx = 0, ty = 0, scale = 1;

      function fitToContainer() {
        const cw = container.clientWidth, ch = container.clientHeight;
        scale = Math.min(cw / CONTENT_W, ch / CONTENT_H) * 0.92;
        tx = (cw - CONTENT_W * scale) / 2;
        ty = (ch - CONTENT_H * scale) / 2;
        applyTransform();
      }

      function applyTransform() {
        vp.setAttribute("transform", `translate(${tx},${ty}) scale(${scale})`);
      }

      // Wheel → zoom centred on cursor
      container.addEventListener("wheel", (e) => {
        e.preventDefault();
        const rect = svg.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const delta = e.deltaY < 0 ? 1.1 : 1 / 1.1;
        const newScale = Math.min(Math.max(scale * delta, 0.15), 6);
        tx = mx - (mx - tx) * (newScale / scale);
        ty = my - (my - ty) * (newScale / scale);
        scale = newScale;
        applyTransform();
      }, { passive: false });

      // Mouse drag → pan
      let dragging = false, startX = 0, startY = 0, startTx = 0, startTy = 0;
      container.addEventListener("mousedown", (e) => {
        if (e.button !== 0) return;
        dragging = true; startX = e.clientX; startY = e.clientY;
        startTx = tx; startTy = ty;
        container.classList.add("dragging");
      });
      window.addEventListener("mousemove", (e) => {
        if (!dragging) return;
        tx = startTx + (e.clientX - startX);
        ty = startTy + (e.clientY - startY);
        applyTransform();
      });
      window.addEventListener("mouseup", () => {
        dragging = false;
        container.classList.remove("dragging");
      });

      // Touch drag & pinch zoom
      let lastTouches = null;
      container.addEventListener("touchstart", (e) => {
        lastTouches = Array.from(e.touches).map(t => ({ x: t.clientX, y: t.clientY }));
      }, { passive: true });
      container.addEventListener("touchmove", (e) => {
        e.preventDefault();
        const cur = Array.from(e.touches).map(t => ({ x: t.clientX, y: t.clientY }));
        if (cur.length === 1 && lastTouches.length === 1) {
          tx += cur[0].x - lastTouches[0].x;
          ty += cur[0].y - lastTouches[0].y;
        } else if (cur.length === 2 && lastTouches.length === 2) {
          const prevDist = Math.hypot(lastTouches[1].x - lastTouches[0].x, lastTouches[1].y - lastTouches[0].y);
          const curDist  = Math.hypot(cur[1].x - cur[0].x, cur[1].y - cur[0].y);
          const pinchScale = curDist / prevDist;
          const cx = (cur[0].x + cur[1].x) / 2 - svg.getBoundingClientRect().left;
          const cy = (cur[0].y + cur[1].y) / 2 - svg.getBoundingClientRect().top;
          const newScale = Math.min(Math.max(scale * pinchScale, 0.15), 6);
          tx = cx - (cx - tx) * (newScale / scale);
          ty = cy - (cy - ty) * (newScale / scale);
          scale = newScale;
        }
        lastTouches = cur;
        applyTransform();
      }, { passive: false });
      container.addEventListener("touchend", () => { lastTouches = null; }, { passive: true });

      // Reset button
      document.getElementById("zoom-reset").addEventListener("click", fitToContainer);

      // Initial fit
      fitToContainer();
      window.addEventListener("resize", fitToContainer);
    })();
  </script>
